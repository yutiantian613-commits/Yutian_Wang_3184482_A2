<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Appliance</title>
</head>
<body>

    <h2>Add New Appliance</h2>
    
    <form action="/add-appliance" method="POST">
        
        <h3>User Details</h3>
        
        <label>First Name:</label>
        <input type="text" name="first_name" pattern="[A-Za-z]{2,50}" required><br><br>
        
        <label>Last Name:</label>
        <input type="text" name="last_name" pattern="[A-Za-z]{2,50}" required><br><br>
        
        <label>Address:</label>
        <input type="text" name="address" required><br><br>

        <label>Email:</label>
        <input type="email" name="email" required><br><br>

        <label>Mobile (08...):</label>
        <input type="text" name="mobile" pattern="^08[3-9][0-9]{7}$" required><br><br>

        <label>Eircode:</label>
        <input type="text" name="eircode" pattern="[A-Za-z0-9]{7}" required><br><br>
        
        <hr>
        
        <h3>Appliance Details</h3>
        
        <label>Appliance Type:</label>
        <select name="appliance_type" required>
            <option value="">Select...</option>
            <option value="Washing Machine">Washing Machine</option>
            <option value="Fridge">Fridge</option>
            <option value="Oven">Oven</option>
            <option value="Dishwasher">Dishwasher</option>
        </select><br><br>

        <label>Brand:</label>
        <input type="text" name="brand" required><br><br>

        <label>Model Number:</label>
        <input type="text" name="model_number" required><br><br>

        <label>Serial Number:</label>
        <input type="text" name="serial_number" pattern="[A-Z0-9]{5,20}" required><br><br>

        <label>Purchase Date:</label>
        <input type="date" name="purchase_date" required><br><br>

        <label>Warranty Expiration:</label>
        <input type="date" name="warranty_date" required><br><br>

        <label>Cost of Appliance (€):</label>
        <input type="number" step="0.01" min="0" name="cost" required><br><br>

        <button type="submit">Save to Database</button>
        
    </form>

</body>
</html>
