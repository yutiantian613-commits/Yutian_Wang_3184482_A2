<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Appliance</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
    </style>
</head>
<body>
    <h2 style="color: red;">Delete an Appliance</h2>
    <p>Warning: This action cannot be undone.</p>
    
    <form action="/delete-appliance" method="POST">
        <label for="serial_number">Enter Serial Number to Delete:</label><br>
        <input type="text" id="serial_number" name="serial_number" required><br><br>

        <button type="submit" style="color: white; background-color: red; padding: 5px 10px; border: none; cursor: pointer;">Delete Appliance</button>
    </form>
    
    <br>
    <a href="index.html">Go Back to Home</a>
</body>
</html>
